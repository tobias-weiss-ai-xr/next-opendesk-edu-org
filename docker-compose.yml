services:
  opendesk-edu:
    image: ghcr.io/tobias-weiss-ai-xr/opendesk-edu:latest
    container_name: opendesk-edu
    restart: unless-stopped
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      # HTTP redirect to HTTPS (excludes ACME challenge path so Let's Encrypt works)
      - "traefik.http.routers.opendesk-edu.rule=Host(`opendesk-edu.org`,`www.opendesk-edu.org`) && !PathPrefix(`/.well-known/acme-challenge/`)"
      - traefik.http.routers.opendesk-edu.entrypoints=web
      - traefik.http.routers.opendesk-edu.middlewares=https-redirect@file
      - "traefik.http.routers.opendesk-edu-secure.rule=Host(`opendesk-edu.org`,`www.opendesk-edu.org`)"
      - traefik.http.routers.opendesk-edu-secure.entrypoints=websecure
      - traefik.http.routers.opendesk-edu-secure.tls=true
      - traefik.http.routers.opendesk-edu-secure.tls.certresolver=mytlschallenge
      - traefik.http.routers.opendesk-edu-secure.middlewares=opendesk-security,compression@file
      # security headers via Docker labels (overrides Traefik file provider's security-headers@file)
      - "traefik.http.middlewares.opendesk-security.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.opendesk-edu.org https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://analytics.opendesk-edu.org https://pagead2.googlesyndication.com; frame-src 'self' https://googleads.g.doubleclick.net; object-src 'none'; base-uri 'self'; form-action 'self'"
      - traefik.http.middlewares.opendesk-security.headers.stsSeconds=63072000
      - traefik.http.middlewares.opendesk-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.opendesk-security.headers.stsPreload=true
      - "traefik.http.middlewares.opendesk-security.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
      - traefik.http.middlewares.opendesk-security.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.opendesk-security.headers.frameDeny=true
      - traefik.http.middlewares.opendesk-security.headers.contentTypeNosniff=true
      - traefik.http.services.opendesk-edu.loadbalancer.server.port=3000
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
    name: traefik-public
