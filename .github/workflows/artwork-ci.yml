name: Artwork CI

on:
  push:
    branches: [main]
    paths:
      - "public/static/**/*.svg"

jobs:
  artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Validate SVGs
        run: bun run validate:svg

      - name: Check color palette
        run: bun run check:palette

      - name: Optimize SVGs
        run: bun run optimize:svg

      - name: Export PNGs
        run: bun run export:png

      - name: Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: optimize SVGs and regenerate PNGs"
          file_pattern: "public/static/"
