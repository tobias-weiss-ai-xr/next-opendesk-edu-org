name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: actions/cache/save@v4
        id: cache-nm
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
      - run: bun run lint
      - run: bun run typecheck
      - run: node scripts/check-integration.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache/restore@v4
        id: cache-nm-restore
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
      - if: steps.cache-nm-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache/restore@v4
        id: cache-nm-restore
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
      - if: steps.cache-nm-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - run: bun run build

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opendesk-edu:latest
            ghcr.io/${{ github.repository_owner }}/opendesk-edu:${{ github.sha }}
          no-cache: true

      - name: Make image public
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/opendesk-edu/visibility" \
            -d '{"visibility":"public"}' || echo "warn: could not set package public"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd "${{ secrets.DEPLOY_PATH }}" || {
              git clone https://github.com/tobias-weiss-ai-xr/next-opendesk-edu-org.git "${{ secrets.DEPLOY_PATH }}"
              cd "${{ secrets.DEPLOY_PATH }}"
            }
            git fetch --all && git reset --hard origin/main
            docker rmi opendesk-edu:latest 2>/dev/null || true
            docker pull ghcr.io/${{ github.repository_owner }}/opendesk-edu:latest
            MAX_RETRIES=3
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Attempt $i/$MAX_RETRIES: docker compose up"
              if docker compose up -d --force-recreate 2>&1; then
                echo "Container started successfully"
                break
              else
                echo "Attempt $i failed (likely OOM)"
                if [ $i -lt $MAX_RETRIES ]; then
                  echo "Waiting 15s before retry..."
                  sleep 15
                else
                  echo "All $MAX_RETRIES attempts failed"
                fi
              fi
            done
            sleep 10
            echo "=== Container Status ==="
            docker ps -a --filter name=opendesk-edu --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            CONTAINER_STATUS=$(docker inspect -f '{{.State.Status}}' opendesk-edu 2>/dev/null || echo "not found")
            echo "Container state: $CONTAINER_STATUS"
            if [ "$CONTAINER_STATUS" != "running" ]; then
              echo "Container is not running - aborting"
              exit 1
            fi
            echo "=== ads.txt route handler ==="
            docker exec opendesk-edu ls -la .next/server/app/ads.txt.body 2>/dev/null || echo "warn: ads.txt.body not found"
            docker exec opendesk-edu cat .next/server/app/ads.txt.body 2>/dev/null
            echo "=== Internal curl tests ==="
            docker exec opendesk-edu node -e "Promise.all([fetch('http://localhost:3000/ads.txt'),fetch('http://localhost:3000/ads.txt',{headers:{'Host':'opendesk-edu.org'}}),fetch('http://localhost:3000/en')]).then(([r1,r2,r3])=>{console.log('localhost /ads.txt:',r1.status,r1.headers.get('content-type'));console.log('Host=domain /ads.txt:',r2.status,r2.headers.get('content-type'));console.log('/en CSP:',r3.headers.get('content-security-policy')?.substring(0,100))}).catch(e=>console.error('Error:',e.message))"
            echo "=== Container Traefik labels ==="
            docker inspect opendesk-edu --format='{{range .Config.Labels}}{{println .}}{{end}}' 2>/dev/null | grep traefik || echo "No traefik labels"
            echo "=== ALL running containers ==="
            docker ps -a --format 'table {{.Names}}	{{.Image}}	{{.Status}}	{{.Ports}}' 2>/dev/null || echo "docker ps failed"
            echo "=== Traefik API (port 8080) ==="
            docker exec traefik wget -qO- http://localhost:8080/api/http/routers 2>/dev/null | python3 -c "import sys,json; [print(r.get('name','?'),r.get('rule','?'),[m for m in r.get('middlewares',[])]) for r in json.load(sys.stdin)]" 2>/dev/null || echo "API not on 8080"
            echo "=== Traefik API: middlewares (port 8080) ==="
            docker exec traefik wget -qO- http://localhost:8080/api/http/middlewares 2>/dev/null | python3 -c "import sys,json; [print(m.get('name','?'),m.get('provider','?')) for m in json.load(sys.stdin)]" 2>/dev/null || echo "API not on 8080"

      - name: Verify deployment
        continue-on-error: true
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 https://opendesk-edu.org) || true
          if [ "$STATUS" = "000" ]; then
            echo "Site unreachable from CI runner"
          elif [ "$STATUS" = "200" ]; then
            echo "Site is live (HTTP 200)"
          else
            echo "Site returned HTTP $STATUS"
          fi
          sleep 5
          ADS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 https://opendesk-edu.org/ads.txt) || true
          echo "ads.txt HTTP status: $ADS_STATUS"
          echo "=== External: /ads.txt headers ==="
          curl -sI --connect-timeout 5 --max-time 10 https://opendesk-edu.org/ads.txt 2>/dev/null || true
          echo "=== External: /en CSP ==="
          curl -sI --connect-timeout 5 --max-time 10 https://opendesk-edu.org/en 2>/dev/null | grep -iE "content-security-policy|strict-transport|permissions-policy" || true
