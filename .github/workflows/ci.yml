name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: actions/cache/save@v4
        id: cache-nm
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
      - run: bun run lint
      - run: bun run typecheck
      - run: node scripts/check-integration.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache/restore@v4
        id: cache-nm-restore
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
      - if: steps.cache-nm-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache/restore@v4
        id: cache-nm-restore
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
      - if: steps.cache-nm-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - run: bun run build

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Clone repo if DEPLOY_PATH doesn't exist or isn't a git repo
            if [ ! -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              rm -rf "${{ secrets.DEPLOY_PATH }}"
              git clone https://github.com/tobias-weiss-ai-xr/next-opendesk-edu-org.git "${{ secrets.DEPLOY_PATH }}"
            fi
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all
            git reset --hard origin/main
            export COMMIT_SHA=$(git rev-parse --short HEAD)
            export IMAGE_TAG="opendesk-edu:${COMMIT_SHA}"
            docker compose build --no-cache
            docker tag opendesk-edu:latest ${IMAGE_TAG} 2>/dev/null || true
            docker compose up -d

      - name: Verify deployment
        continue-on-error: true
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 https://opendesk-edu.org) || true
          if [ "$STATUS" = "000" ]; then
            echo "⚠️ Site unreachable from CI runner (expected for private/intranet deployments). Deployment itself succeeded."
          elif [ "$STATUS" = "200" ]; then
            echo "✅ Site is live (HTTP 200)"
          else
            echo "⚠️ Site returned HTTP $STATUS"
          fi
