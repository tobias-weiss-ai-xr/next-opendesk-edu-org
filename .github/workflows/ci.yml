name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: actions/cache/save@v4
        id: cache-nm
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
      - run: bun run lint
      - run: bun run typecheck
      - run: node scripts/check-integration.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache/restore@v4
        id: cache-nm-restore
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
      - if: steps.cache-nm-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache/restore@v4
        id: cache-nm-restore
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
      - if: steps.cache-nm-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - run: bun run build

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opendesk-edu:latest
            ghcr.io/${{ github.repository_owner }}/opendesk-edu:${{ github.sha }}
          no-cache: true

      - name: Make image public
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/opendesk-edu/visibility" \
            -d '{"visibility":"public"}' || echo "warn: could not set package public"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Clone repo if DEPLOY_PATH doesn't exist or isn't a git repo
            if [ ! -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              rm -rf "${{ secrets.DEPLOY_PATH }}"
              git clone https://github.com/tobias-weiss-ai-xr/next-opendesk-edu-org.git "${{ secrets.DEPLOY_PATH }}"
            fi
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all
            git reset --hard origin/main
            # Remove old local image to avoid stale cache
            docker rmi opendesk-edu:latest 2>/dev/null || true
            # Pull pre-built image from ghcr.io (avoids building on memory-constrained server)
            docker pull ghcr.io/${{ github.repository_owner }}/opendesk-edu:latest
            # docker-compose.yml already uses ghcr.io image directly (no sed needed)
            docker compose up -d --force-recreate
            # Verify the container is running the correct image
            docker inspect opendesk-edu --format='Image: {{.Config.Image}}' || true
            # Verify public/ads.txt exists in the container
            docker exec opendesk-edu ls -la public/ads.txt 2>/dev/null || echo "warn: public/ads.txt not found in container"
            # Verify the CSP includes pagead2.googlesyndication.com
            docker exec opendesk-edu grep -r "pagead2.googlesyndication.com" /app/server.js 2>/dev/null || echo "warn: pagead2 not found in server.js"

      - name: Verify deployment
        continue-on-error: true
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 https://opendesk-edu.org) || true
          if [ "$STATUS" = "000" ]; then
            echo "⚠️ Site unreachable from CI runner (expected for private/intranet deployments). Deployment itself succeeded."
          elif [ "$STATUS" = "200" ]; then
            echo "✅ Site is live (HTTP 200)"
          else
            echo "⚠️ Site returned HTTP $STATUS"
          fi
          # Verify ads.txt is served
          ADS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 https://opendesk-edu.org/ads.txt) || true
          echo "ads.txt HTTP status: $ADS_STATUS"
          if [ "$ADS_STATUS" = "200" ]; then
            echo "✅ ads.txt is served"
          else
            echo "⚠️ ads.txt returned HTTP $ADS_STATUS"
          fi
