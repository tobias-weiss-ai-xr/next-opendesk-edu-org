name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: actions/cache/save@v4
        id: cache-nm
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
      - run: bun run lint
      - run: bun run typecheck
      - run: node scripts/check-integration.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache/restore@v4
        id: cache-nm-restore
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
      - if: steps.cache-nm-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache/restore@v4
        id: cache-nm-restore
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
      - if: steps.cache-nm-restore.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - run: bun run build

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opendesk-edu:latest
            ghcr.io/${{ github.repository_owner }}/opendesk-edu:${{ github.sha }}
          no-cache: true

      - name: Make image public
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/opendesk-edu/visibility" \
            -d '{"visibility":"public"}' || echo "warn: could not set package public"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Clone repo if DEPLOY_PATH doesn't exist or isn't a git repo
            if [ ! -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              rm -rf "${{ secrets.DEPLOY_PATH }}"
              git clone https://github.com/tobias-weiss-ai-xr/next-opendesk-edu-org.git "${{ secrets.DEPLOY_PATH }}"
            fi
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all
            git reset --hard origin/main
            # Remove old local image to avoid stale cache
            docker rmi opendesk-edu:latest 2>/dev/null || true
            # Pull pre-built image from ghcr.io (avoids building on memory-constrained server)
            docker pull ghcr.io/${{ github.repository_owner }}/opendesk-edu:latest
            # docker-compose.yml already uses ghcr.io image directly (no sed needed)
            docker compose up -d --force-recreate
            # Verify the container is running the correct image
            docker inspect opendesk-edu --format='Image: {{.Config.Image}}' || true
            # Debug: Check if ads.txt route handler is in the container
            echo "=== Debug: ads.txt route handler ==="
            docker exec opendesk-edu ls -la .next/server/app/ads.txt.body 2>/dev/null || echo "warn: .next/server/app/ads.txt.body not found"
            docker exec opendesk-edu ls -la .next/server/app/ads.txt.meta 2>/dev/null || echo "warn: .next/server/app/ads.txt.meta not found"
            docker exec opendesk-edu cat .next/server/app/ads.txt.body 2>/dev/null || echo "warn: could not read ads.txt.body"
            docker exec opendesk-edu grep -o '"/ads.txt"' .next/prerender-manifest.json 2>/dev/null || echo "warn: /ads.txt not in prerender-manifest.json"
            docker exec opendesk-edu grep -o '"/ads.txt/route"' .next/app-paths-manifest.json 2>/dev/null || echo "warn: /ads.txt/route not in app-paths-manifest.json"
            # Debug: curl /ads.txt from inside the container (with and without Host header)
            echo "=== Debug: curl /ads.txt from inside container ==="
            docker exec opendesk-edu node -e "fetch('http://localhost:3000/ads.txt').then(r=>{console.log('Status:',r.status);console.log('Content-Type:',r.headers.get('content-type'));console.log('CSP:',r.headers.get('content-security-policy'));return r.text()}).then(t=>console.log('Body:',t.substring(0,200))).catch(e=>console.error('Error:',e.message))" 2>/dev/null || echo "warn: could not curl from inside container"
            docker exec opendesk-edu node -e "fetch('http://localhost:3000/ads.txt',{headers:{'Host':'opendesk-edu.org'}}).then(r=>{console.log('Status (with Host):',r.status);console.log('Content-Type:',r.headers.get('content-type'));console.log('CSP:',r.headers.get('content-security-policy'));return r.text()}).then(t=>console.log('Body:',t.substring(0,200))).catch(e=>console.error('Error:',e.message))" 2>/dev/null || echo "warn: could not curl with Host header"
            # Debug: curl /en from inside the container to check CSP
            echo "=== Debug: curl /en from inside container ==="
            docker exec opendesk-edu node -e "fetch('http://localhost:3000/en').then(r=>{console.log('Status:',r.status);console.log('CSP:',r.headers.get('content-security-policy'))}).catch(e=>console.error('Error:',e.message))" 2>/dev/null || echo "warn: could not curl /en from inside container"
            # Debug: Check CSP in build output
            echo "=== Debug: CSP in build output ==="
            docker exec opendesk-edu grep -r "pagead2.googlesyndication.com" .next/server/chunks/ 2>/dev/null | head -3 || echo "warn: pagead2 not found in chunks"
            # Debug: Check Traefik labels on container
            echo "=== Debug: Container Traefik labels ==="
            docker inspect opendesk-edu --format='{{range .Config.Labels}}{{println .}}{{end}}' 2>/dev/null | head -20
            # Debug: Check for multiple containers
            echo "=== Debug: docker ps ==="
            docker ps --filter name=opendesk-edu --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null || true
            # Debug: Container logs (last 10 lines)
            echo "=== Debug: Container logs ==="
            docker logs opendesk-edu --tail 10 2>/dev/null || echo "warn: could not get logs"
            # Debug: Check docker-compose.yml on server for security-headers
            echo "=== Debug: docker-compose.yml security-headers check ==="
            grep -n "security-headers" docker-compose.yml 2>/dev/null || echo "security-headers NOT found in docker-compose.yml (correct)"
            grep -n "compression" docker-compose.yml 2>/dev/null || echo "compression NOT found in docker-compose.yml"
            # Debug: Check if Traefik has a security-headers middleware in dynamic config
            echo "=== Debug: Traefik dynamic config check ==="
            docker exec traefik cat /etc/traefik/dynamic.yml 2>/dev/null | grep -A 5 "security-headers" || echo "No traefik container or no dynamic.yml"
            docker exec traefik cat /etc/traefik/traefik.yml 2>/dev/null | grep -A 5 "security" || echo "No security in traefik.yml"

      - name: Verify deployment
        continue-on-error: true
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 https://opendesk-edu.org) || true
          if [ "$STATUS" = "000" ]; then
            echo "⚠️ Site unreachable from CI runner (expected for private/intranet deployments). Deployment itself succeeded."
          elif [ "$STATUS" = "200" ]; then
            echo "✅ Site is live (HTTP 200)"
          else
            echo "⚠️ Site returned HTTP $STATUS"
          fi
          # Verify ads.txt is served
          sleep 5
          ADS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 https://opendesk-edu.org/ads.txt) || true
          echo "ads.txt HTTP status: $ADS_STATUS"
          if [ "$ADS_STATUS" = "200" ]; then
            echo "✅ ads.txt is served"
          else
            echo "⚠️ ads.txt returned HTTP $ADS_STATUS"
          fi
          # Debug: curl /ads.txt with full response headers
          echo "=== Debug: /ads.txt full response ==="
          curl -sI --connect-timeout 5 --max-time 10 https://opendesk-edu.org/ads.txt 2>/dev/null || true
          echo "=== Debug: /ads.txt body ==="
          curl -s --connect-timeout 5 --max-time 10 https://opendesk-edu.org/ads.txt 2>/dev/null | head -5 || true
          echo "=== Debug: /en status ==="
          curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 https://opendesk-edu.org/en 2>/dev/null || true
